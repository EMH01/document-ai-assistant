[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-ai-assistant"
version = "0.1.0"
description = "A transparent multimodal RAG assistant for PDF question answering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "openai>=1.68",
  "PyMuPDF>=1.24",
  "python-dotenv>=1.0",
  "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_ai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
